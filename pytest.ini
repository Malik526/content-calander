[pytest]
testpaths = tests
# Milestone 3.0 (package refactor): content_automation lives under src/ (see
# pyproject.toml for the editable install every runtime/CLI import relies
# on); cli/ and tools/evaluation/ hold standalone scripts (not part of the
# installed package) that tests still import by their bare module name
# (e.g. "import evaluate_transcription", "import migrate_relocated_paths as
# mrp") exactly as before the refactor — this makes that resolve without a
# conftest.py sys.path hack.
pythonpath = cli tools/evaluation
