# Netlify deployment config for the Content Automation public site
# (Milestone 2.0.1). Scoped to web/ via `base` — the repository root also
# contains the unrelated Python backend/CLI tooling, which Netlify must
# never try to build.
#
# Static export (see web/next.config.ts: output: "export") — no Netlify
# Next.js runtime plugin needed, since there are no server-rendered/
# dynamic routes yet. Revisit this file if that changes.

[build]
  base = "web"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Milestone 3.6 — the Milestone 3.5 blocker is closed: real Supabase Auth
# replaced the mock session (web/lib/session.tsx), and
# NEXT_PUBLIC_ALLOW_MOCK_SESSION no longer exists anywhere in this
# codebase — a production build with Supabase unconfigured now fails
# closed unconditionally, with no bypass flag.
#
# NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, and
# NEXT_PUBLIC_API_BASE_URL are NOT set here (deliberately, not an
# oversight): real values aren't committed as a matter of habit even
# though they are meant to be public (the Supabase anon key is a public
# API key by design — Row Level Security, not secrecy, protects data
# behind it), and they weren't available yet at the time this file was
# last edited. Set them via Netlify's dashboard (Site configuration ->
# Environment variables) before the next deploy — until then, the
# deployed /app shell will correctly fail closed (see
# web/lib/session.tsx) rather than silently rendering broken. See
# docs/decisions/0011-real-authentication-and-tiktok-connection.md.
