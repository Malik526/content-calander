# Autobuild project configuration for Content Automation / Pickle Batch.
# Framework, schemas and policy: ~/.agents/autobuild (AI engineering harness).
# Validate from this repository's root: autobuild config .   (see .autobuild/README.md)
version: 1

project:
  name: Content Automation

agents:                          # any registered provider may fill any role
  planner:
    provider: codex
  implementer:
    provider: claude
  reviewer:
    provider: codex              # independence = fresh session; claude would also be valid

git:
  protected_branches: [main]
  branch_prefix: agent/
  checkpoint_commits: true       # one controller commit on the run branch after validation passes; never pushed

paths:
  roadmap: docs/roadmap          # README index + <milestone>/<implementation-brief>.md
  project_state: PROJECT_STATE.md
  adr_directory: docs/decisions
  runs_directory: .autobuild/runs

limits:
  max_review_cycles: 3
  max_consecutive_implementations: 5
  implementer_timeout_seconds: 3600

validation:
  browser_tool: playwright       # declared tool; no browser_gates are configured yet, so no browser checks run
  require_clean_git_before_start: true
  # Controller-owned validation runs in a disposable, sandboxed copy of the run's
  # exact source snapshot (no network unless a command opts in, no inherited env).
  # Ignored dependency trees are not in that snapshot, so they are mounted
  # read-only from this checkout: the shared .venv, and web/node_modules (a fresh
  # `npm ci` cannot run there: Next's native packages exceed the sandbox's 64 MiB
  # per-file write limit). pytest.ini's `pythonpath = src ...` makes tests import
  # the snapshot's src/ rather than the checkout the .venv's editable install names.
  # Keep both trees current locally (`pip install -r requirements.txt`, `npm ci`).
  runtime_paths: [.venv, web/node_modules]
  commands:
    - name: pytest
      kind: test
      command: [.venv/bin/python, -m, pytest, -q]
      timeout_seconds: 1800
    - name: web-deps
      kind: setup
      cwd: web
      command: [npm, ls, --depth=0]  # offline: fails if package.json needs packages the mounted tree lacks
      paths: ["web/*"]
      timeout_seconds: 300
    - name: web-lint
      kind: lint
      cwd: web
      command: [npm, run, lint]
      paths: ["web/*"]
    - name: web-typecheck
      kind: typecheck
      cwd: web
      command: [npx, tsc, --noEmit]
      paths: ["web/*"]
    - name: web-test
      kind: test
      cwd: web
      # --configLoader runner: load vitest.config.mts in place; the default bundler
      # writes a temp file into node_modules, which is read-only in validation.
      command: [npm, test, --, --configLoader, runner]
      paths: ["web/*"]

notifications:
  enabled: false                 # console | file | email are available; see the harness NOTIFICATION_CONTRACT
  provider: console

control:
  remote_stop_enabled: false     # set true with provider: file to allow `autobuild stop <run>`
  provider: none
